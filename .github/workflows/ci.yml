name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The build and the tests must never need a real database or the auth token.
  CRM_AUTH: "off"
  CRM_DB_PATH: /tmp/ci/crm.db
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to exact commits (the tag named beside each), so a moved tag can't change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json

      - name: MCP server syntax
        run: node --check scripts/mcp-server.mjs

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
