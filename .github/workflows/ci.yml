name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The build and the tests must never need a real database or the auth token.
  CRM_AUTH: "off"
  CRM_DB_PATH: /tmp/ci/crm.db
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to exact commits (the tag named beside each), so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json

      - name: MCP server syntax
        run: node --check scripts/mcp-server.mjs

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
